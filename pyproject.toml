[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-router"
version = "1.0.0-rc.1"
description = "Production-ready AI Gateway with intelligent routing, health checks, and fallback"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "salmansaidibrohim267-prog", email = "salmansaidibrohim267-prog@users.noreply.github.com" },
]

[project.urls]
Homepage = "https://github.com/salmansaidibrohim267-prog/AI-Router"
Repository = "https://github.com/salmansaidibrohim267-prog/AI-Router"
Documentation = "https://github.com/salmansaidibrohim267-prog/AI-Router#readme"
Issues = "https://github.com/salmansaidibrohim267-prog/AI-Router/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = ["asyncio: async tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "app/scoring.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "def __repr__",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E203"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_implicit_optional = true
disable_error_code = ["attr-defined", "arg-type", "valid-type", "assignment", "union-attr", "dict-item", "return-value", "misc", "var-annotated", "override", "operator", "index", "func-returns-value", "call-overload"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "F401"]
