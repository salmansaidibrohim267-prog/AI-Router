# AI Router Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "ai-router"
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-router:8000"]
        labels:
          service: ai-router
          environment: production

  - job_name: "prometheus"
    scrape_interval: 30s
    static_configs:
      - targets: ["localhost:9090"]
