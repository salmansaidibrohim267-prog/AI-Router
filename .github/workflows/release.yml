name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump: patch | minor | major | rc | release"
        required: true
        default: "rc"
        type: choice
        options:
          - rc
          - patch
          - minor
          - major
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ai-router

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Derive next version and changelog
        id: release
        run: |
          PYTHONPATH=. python -c "
          import json, pathlib
          from app.release import ReleaseManager, ReleaseConfig
          manager = ReleaseManager(ReleaseConfig(history_file='dist/release/history.json'))
          version = manager.next_version('${{ github.event.inputs.bump }}')
          entry = manager.create_release(str(version))
          manager.write_changelog()
          manager.save_history()
          pathlib.Path('version.txt').write_text(str(version))
          print(json.dumps({'version': str(version)}))
          "
          VERSION=$(cat version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: |
          mkdir -p dist/release
          cp -r app dist/release/app
          cp requirements.txt pyproject.toml README.md dist/release/
          cp deployment/Dockerfile.prod dist/release/Dockerfile
          cp CHANGELOG.md dist/release/

      - name: Stage artifact manifest and sign
        run: |
          PYTHONPATH=. python -c "
          from app.release import ReleaseManager, ReleaseConfig
          manager = ReleaseManager(ReleaseConfig(history_file='dist/release/history.json'))
          manager.create_release('${{ steps.release.outputs.version }}')
          manager.build_artifact_manifest('${{ steps.release.outputs.version }}', {
              'ai-router-${{ steps.release.outputs.version }}.tar.gz': 'dist/release/app',
          })
          signature = manager.sign_manifest('${{ steps.release.outputs.version }}')
          import json
          json.dump(signature.to_dict(), open('dist/release/signature.json', 'w'), indent=2)
          manager.save_history()
          print('manifest signed:', signature.algorithm)
          "

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/release/sbom.spdx.json

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.version }}
          body_path: CHANGELOG.md
          files: |
            dist/release/signature.json
            dist/release/history.json
            dist/release/sbom.spdx.json
            CHANGELOG.md
          prerelease: ${{ contains(steps.release.outputs.version, '-') }}
          generate_release_notes: true

      - name: Push release tag back
        run: |
          git config user.name "CI Bot"
          git config user.email "salmansaidibrohim267-prog@users.noreply.github.com"
          git add CHANGELOG.md dist/release/history.json
          git commit -m "chore(release): ${{ steps.release.outputs.version }}" || true
          git push origin main

  docker-publish:
    name: Publish Docker image to GHCR
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build timestamp
        id: build
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.release.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.release.outputs.tag }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build.outputs.date }}
          labels: |
            org.opencontainers.image.title=AI Router Gateway
            org.opencontainers.image.description=Production AI Gateway with intelligent routing, health checks, and fallback
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.created=${{ steps.build.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image
        run: |
          image="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          for tag in latest ${{ needs.release.outputs.version }} ${{ needs.release.outputs.tag }}; do
            docker buildx imagetools inspect "${image}:${tag}" >/dev/null
            echo "verified: ${image}:${tag}"
          done