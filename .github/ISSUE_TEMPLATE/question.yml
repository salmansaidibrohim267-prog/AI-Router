name: Question
description: Ask a question about using, configuring, or deploying AI Router
title: "[Question] "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Before asking, please check the README, `docs/troubleshooting.md`,
        and existing issues/discussions.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What do you need help with?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Version or git commit you are running (e.g. v1.0.0-rc.1)
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Local (python)
        - Docker
        - Docker Compose
        - Kubernetes
        - Helm
        - Distributed (workers)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Config excerpts, error output, request IDs. Do not paste API keys.
