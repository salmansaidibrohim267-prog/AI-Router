apiVersion: v1
kind: Namespace
metadata:
  name: ai-router
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-router
  namespace: ai-router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-router
  namespace: ai-router
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-router
  namespace: ai-router
subjects:
  - kind: ServiceAccount
    name: ai-router
    namespace: ai-router
roleRef:
  kind: Role
  name: ai-router
  apiGroup: rbac.authorization.k8s.io
